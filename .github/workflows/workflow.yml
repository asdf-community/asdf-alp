name: Main workflow

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 5"

jobs:
  plugin_test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Test plugin
        uses: asdf-vm/actions/plugin-test@v4
        with:
          command: alp --version

  test:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set-up asdf
        uses: asdf-vm/actions/setup@v4
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master
      - name: Install cram
        run: brew install cram
      - name: Test plugin
        run: |
          asdf plugin add alp .
          cram test

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Run ShellCheck
        run: shellcheck bin/*

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master
      - name: Install shfmt
        run: brew install shfmt
      - name: Run shfmt
        run: shfmt --diff .
